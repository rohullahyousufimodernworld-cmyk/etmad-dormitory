<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Employee | Etmad Dormitory</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px 15px;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            color: #1e293b;
        }

        .card {
            max-width: 760px;
            margin: auto;
            padding: 28px;
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(15, 23, 42, 0.08);
        }

        h1 {
            margin-top: 0;
            color: #4338ca;
        }

        .subtitle {
            color: #64748b;
            margin-bottom: 25px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 18px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            font-size: 14px;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 9px;
            background: white;
            font-size: 14px;
        }

        input:focus, select:focus {
            outline: 2px solid #c7d2fe;
            border-color: #6366f1;
        }

        .actions {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
            margin-top: 25px;
        }

        .btn {
            padding: 12px 18px;
            border: 0;
            border-radius: 9px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            font-size: 14px;
        }

        .save {
            background: #4f46e5;
            color: white;
        }

        .save:hover {
            background: #3730a3;
        }

        .cancel {
            background: #e2e8f0;
            color: #334155;
        }

        .error {
            padding: 12px;
            margin-bottom: 18px;
            color: #b91c1c;
            background: #fef2f2;
            border-radius: 8px;
        }

        @media (max-width: 550px) {
            .grid {
                grid-template-columns: 1fr;
            }

            .card {
                padding: 20px;
            }
        }
    </style>
</head>

<body>
    <div class="card">
        <h1>✏️ Edit Employee</h1>
        <p class="subtitle">
            Update employee information and save your changes.
        </p>

        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}

        <form method="POST"
              action="{{ url_for('edit_employee', employee_id=employee[0]) }}">

            <div class="grid">
                <div>
                    <label for="name">Employee Name *</label>
                    <input type="text" id="name" name="name"
                           value="{{ employee[1] or '' }}" required>
                </div>

                <div>
                    <label for="father_name">Father Name</label>
                    <input type="text" id="father_name" name="father_name"
                           value="{{ employee[2] or '' }}">
                </div>

                <div>
                    <label for="phone">Phone</label>
                    <input type="text" id="phone" name="phone"
                           value="{{ employee[3] or '' }}">
                </div>

                <div>
                    <label for="employee_type_id">Position *</label>
                    <select id="employee_type_id" name="employee_type_id" required>
                        <option value="">Select Position</option>

                        {% for item in employee_types %}
                            <option value="{{ item[0] }}"
                                {% if item[0] == employee[4] %}selected{% endif %}>
                                {{ item[1] }}
                            </option>
                        {% endfor %}
                    </select>
                </div>

                <div>
                    <label for="salary">Monthly Salary</label>
                    <input type="number" id="salary" name="salary"
                           min="0" step="0.01"
                           value="{{ employee[5] if employee[5] is not none else '' }}">
                </div>

                <div>
                    <label for="hire_date">Hire Date</label>
                    <input type="date" id="hire_date" name="hire_date"
                           value="{{ employee[6].strftime('%Y-%m-%d') if employee[6] else '' }}">
                </div>

                <div>
                    <label for="status">Status</label>
                    <select id="status" name="status">
                        <option value="Active"
                            {% if employee[7] == 'Active' %}selected{% endif %}>
                            Active
                        </option>

                        <option value="Inactive"
                            {% if employee[7] == 'Inactive' %}selected{% endif %}>
                            Inactive
                        </option>
                    </select>
                </div>
            </div>

            <div class="actions">
                <a class="btn cancel"
                   href="{{ url_for('employees_page') }}">
                    Cancel
                </a>

                <button class="btn save" type="submit">
                    Save Changes
                </button>
            </div>
        </form>
    </div>
</body>
</html>
